name: Tests et EXE Windows

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Installer les dépendances
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Tests de non-régression
        run: python -m pytest -q

      - name: Construire l'exécutable
        run: python -m PyInstaller --noconfirm --clean Dofus-MultiCompte-Enhancer.spec

      - name: Vérifier l'exécutable
        shell: pwsh
        run: |
          $exe = "dist/Dofus-MultiCompte-Enhancer.exe"
          if (-not (Test-Path -LiteralPath $exe)) {
            throw "Exécutable absent : $exe"
          }
          if ((Get-Item -LiteralPath $exe).Length -lt 1MB) {
            throw "Exécutable anormalement petit."
          }

      - name: Publier l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: Dofus-MultiCompte-Enhancer-Windows-${{ github.sha }}
          path: dist/Dofus-MultiCompte-Enhancer.exe
          if-no-files-found: error
          retention-days: 14

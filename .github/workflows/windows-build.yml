name: Windows CI and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Resolve the application version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $version = $env:GITHUB_REF_NAME.TrimStart("v")
          } else {
            $version = "0.0.$env:GITHUB_RUN_NUMBER"
          }
          "APP_VERSION = `"$version`"" | Set-Content -Encoding UTF8 app/build_version.py
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding UTF8 -Append

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Run regression tests
        run: python -m pytest -q

      - name: Build the executable
        run: python -m PyInstaller --noconfirm --clean Dofus-MultiCompte-Enhancer.spec

      - name: Build portable and installer packages
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item -LiteralPath "dist/Dofus-MultiCompte-Enhancer.exe" -Destination "release/Dofus-MultiCompte-Enhancer.exe"
          Compress-Archive -LiteralPath "dist/Dofus-MultiCompte-Enhancer.exe" -DestinationPath "release/Dofus-MultiCompte-Enhancer-Portable.zip" -Force
          $compiler = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6/ISCC.exe"
          if (-not (Test-Path -LiteralPath $compiler)) {
            throw "Inno Setup compiler not found: $compiler"
          }
          & $compiler "/DMyAppVersion=$env:APP_VERSION" "installer/Dofus-MultiCompte-Enhancer.iss"

      - name: Validate distribution packages
        shell: pwsh
        run: |
          $packages = @(
            "release/Dofus-MultiCompte-Enhancer.exe",
            "release/Dofus-MultiCompte-Enhancer-Portable.zip",
            "release/Dofus-MultiCompte-Enhancer-Setup.exe"
          )
          foreach ($package in $packages) {
            if (-not (Test-Path -LiteralPath $package)) {
              throw "Distribution package not found: $package"
            }
            if ((Get-Item -LiteralPath $package).Length -lt 1MB) {
              throw "Distribution package is unexpectedly small: $package"
            }
          }

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v6
        with:
          name: Dofus-MultiCompte-Enhancer-Windows
          path: release/*
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test-and-build
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Download validated distribution packages
        uses: actions/download-artifact@v6
        with:
          name: Dofus-MultiCompte-Enhancer-Windows
          path: release

      - name: Create the GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "release/Dofus-MultiCompte-Enhancer.exe" `
            "release/Dofus-MultiCompte-Enhancer-Portable.zip" `
            "release/Dofus-MultiCompte-Enhancer-Setup.exe" `
            --repo "${{ github.repository }}" `
            --title "Dofus MultiCompte Enhancer ${{ github.ref_name }}" `
            --generate-notes `
            --verify-tag

name: Windows CI and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      SIGNING_ENABLED: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 != '' && secrets.WINDOWS_CERTIFICATE_PASSWORD != '' }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Resolve the application version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $version = $env:GITHUB_REF_NAME.TrimStart("v")
          } else {
            $version = "0.0.$env:GITHUB_RUN_NUMBER"
          }
          "APP_VERSION = `"$version`"" | Set-Content -Encoding UTF8 app/build_version.py
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding UTF8 -Append

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Run regression tests
        run: python -m pytest -q

      - name: Build the executable
        run: python -m PyInstaller --noconfirm --clean Dofus-MultiCompte-Enhancer.spec

      - name: Configure Authenticode signing
        if: env.SIGNING_ENABLED == 'true'
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "windows-code-signing.pfx"
          [IO.File]::WriteAllBytes(
            $certificatePath,
            [Convert]::FromBase64String($env:CERTIFICATE_BASE64)
          )
          $securePassword = ConvertTo-SecureString $env:CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate `
            -FilePath $certificatePath `
            -CertStoreLocation Cert:\CurrentUser\My `
            -Password $securePassword
          if (-not $certificate.Thumbprint) {
            throw "The code-signing certificate could not be imported."
          }
          "SIGN_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" | `
            Out-File -FilePath $env:GITHUB_ENV -Encoding UTF8 -Append

      - name: Sign the application executable
        if: env.SIGNING_ENABLED == 'true'
        shell: pwsh
        run: |
          $signTool = Get-ChildItem `
            "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | `
            Sort-Object FullName -Descending | `
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $signTool) {
            throw "SignTool was not found on the Windows runner."
          }
          & $signTool sign `
            /sha1 $env:SIGN_CERTIFICATE_THUMBPRINT `
            /fd SHA256 `
            /tr http://timestamp.digicert.com `
            /td SHA256 `
            /d "Dofus MultiCompte Enhancer" `
            "dist/Dofus-MultiCompte-Enhancer.exe"
          if ($LASTEXITCODE -ne 0) {
            throw "Authenticode signing failed for the application executable."
          }

      - name: Build portable and installer packages
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item -LiteralPath "dist/Dofus-MultiCompte-Enhancer.exe" -Destination "release/Dofus-MultiCompte-Enhancer.exe"
          Compress-Archive -LiteralPath "dist/Dofus-MultiCompte-Enhancer.exe" -DestinationPath "release/Dofus-MultiCompte-Enhancer-Portable.zip" -Force
          $compiler = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6/ISCC.exe"
          if (-not (Test-Path -LiteralPath $compiler)) {
            throw "Inno Setup compiler not found: $compiler"
          }
          $compilerArguments = @(
            "/DMyAppVersion=$env:APP_VERSION"
          )
          if ($env:SIGNING_ENABLED -eq "true") {
            $signTool = Get-ChildItem `
              "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | `
              Sort-Object FullName -Descending | `
              Select-Object -First 1 -ExpandProperty FullName
            $signCommand = (
              "`$q{0}`$q sign /sha1 {1} /fd SHA256 " +
              "/tr http://timestamp.digicert.com /td SHA256 " +
              "/d `$qDofus MultiCompte Enhancer`$q `$f"
            ) -f $signTool, $env:SIGN_CERTIFICATE_THUMBPRINT
            $compilerArguments += "/DEnableCodeSigning=1"
            $compilerArguments += "/Sdmce=$signCommand"
          }
          $compilerArguments += "installer/Dofus-MultiCompte-Enhancer.iss"
          & $compiler @compilerArguments
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup compilation failed."
          }

      - name: Validate distribution packages
        shell: pwsh
        run: |
          $packages = @(
            "release/Dofus-MultiCompte-Enhancer.exe",
            "release/Dofus-MultiCompte-Enhancer-Portable.zip",
            "release/Dofus-MultiCompte-Enhancer-Setup.exe"
          )
          foreach ($package in $packages) {
            if (-not (Test-Path -LiteralPath $package)) {
              throw "Distribution package not found: $package"
            }
            if ((Get-Item -LiteralPath $package).Length -lt 1MB) {
              throw "Distribution package is unexpectedly small: $package"
            }
          }

      - name: Verify Authenticode signatures
        if: env.SIGNING_ENABLED == 'true'
        shell: pwsh
        run: |
          $signTool = Get-ChildItem `
            "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | `
            Sort-Object FullName -Descending | `
            Select-Object -First 1 -ExpandProperty FullName
          foreach ($package in @(
            "release/Dofus-MultiCompte-Enhancer.exe",
            "release/Dofus-MultiCompte-Enhancer-Setup.exe"
          )) {
            & $signTool verify /pa /all /v $package
            if ($LASTEXITCODE -ne 0) {
              throw "Authenticode verification failed: $package"
            }
          }

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v6
        with:
          name: Dofus-MultiCompte-Enhancer-Windows
          path: release/*
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test-and-build
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Download validated distribution packages
        uses: actions/download-artifact@v6
        with:
          name: Dofus-MultiCompte-Enhancer-Windows
          path: release

      - name: Create the GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "release/Dofus-MultiCompte-Enhancer.exe" `
            "release/Dofus-MultiCompte-Enhancer-Portable.zip" `
            "release/Dofus-MultiCompte-Enhancer-Setup.exe" `
            --repo "${{ github.repository }}" `
            --title "Dofus MultiCompte Enhancer ${{ github.ref_name }}" `
            --generate-notes `
            --verify-tag

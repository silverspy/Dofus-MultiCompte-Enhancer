name: Windows CI and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Run regression tests
        run: python -m pytest -q

      - name: Build the executable
        run: python -m PyInstaller --noconfirm --clean Dofus-MultiCompte-Enhancer.spec

      - name: Validate the executable
        shell: pwsh
        run: |
          $exe = "dist/Dofus-MultiCompte-Enhancer.exe"
          if (-not (Test-Path -LiteralPath $exe)) {
            throw "Executable not found: $exe"
          }
          if ((Get-Item -LiteralPath $exe).Length -lt 1MB) {
            throw "The executable is unexpectedly small."
          }

      - name: Upload the executable artifact
        uses: actions/upload-artifact@v6
        with:
          name: Dofus-MultiCompte-Enhancer-Windows
          path: dist/Dofus-MultiCompte-Enhancer.exe
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test-and-build
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Download the validated executable
        uses: actions/download-artifact@v6
        with:
          name: Dofus-MultiCompte-Enhancer-Windows
          path: release

      - name: Create the GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "release/Dofus-MultiCompte-Enhancer.exe" `
            --repo "${{ github.repository }}" `
            --title "Dofus MultiCompte Enhancer ${{ github.ref_name }}" `
            --generate-notes `
            --verify-tag
